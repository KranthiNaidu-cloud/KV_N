<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Romantic Love Message</title>

<style>
body {
    margin:0;
    overflow:hidden;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#ff758c,#ff7eb3,#ffb199,#ffc3a0);
    font-family:'Segoe Script', cursive;
}

/* Intro Button */
#introMessage {
    background:rgba(255,255,255,0.25);
    backdrop-filter:blur(10px);
    padding:30px 50px;
    border-radius:20px;
    color:white;
    font-size:36px;
    font-weight:bold;
    text-align:center;
    cursor:pointer;
    box-shadow:0 0 30px rgba(255,0,100,0.5);
    animation:glow 3s infinite alternate;
}

@keyframes glow {
    from { box-shadow:0 0 20px #ff4d6d; }
    to { box-shadow:0 0 50px #ff99aa; }
}

/* Hidden Message Box */
#messageBox {
    display:none;
    background:rgba(255,255,255,0.2);
    backdrop-filter:blur(12px);
    padding:50px;
    border-radius:25px;
    color:white;
    font-size:30px;
    font-weight:bold;
    text-align:center;
    box-shadow:0 0 40px rgba(255,0,100,0.6);
    animation:glow 3s infinite alternate;
}

/* Floating elements */
.loveIcon {
    position:absolute;
    bottom:-50px;
    animation:floatUp linear forwards;
}

@keyframes floatUp {
    0% { transform:translateY(0) scale(1); opacity:1; }
    100% { transform:translateY(-100vh) scale(1.6); opacity:0; }
}
</style>
</head>

<body>

<!-- Intro message -->
<div id="introMessage">💖 Hey Cutie 💖<br>
    💖 Idhigo naa Cheetie 💖<br>
    💖 Rasanu tagi 4 Tea💖<br></div>

<!-- Hidden romantic message -->
<div id="messageBox">
🌹 1. Full ga Thinu ❤️ <br><br>
🧸 2. Full ga Sleep Veyu ❤️ <br><br>
🌹 3. Dreams lo Natho Fight Chey ❤️ <br><br>
🧸 4. Kudirthe oka Kiss ivvu Ledhu ante Hug ivvu ❤️ <br><br>
🌹 5. Oppukunte Free ga Kargistha Nee Kovvu ❤️
</div>

<script>
function createLoveIcon() {
    const icons = ["❤️","🌹","🧸"];
    const icon = document.createElement("div");
    icon.className = "loveIcon";
    icon.innerHTML = icons[Math.floor(Math.random()*icons.length)];

    icon.style.left = Math.random()*window.innerWidth+"px";
    icon.style.fontSize = (20+Math.random()*40)+"px";
    icon.style.animationDuration = (5+Math.random()*5)+"s";

    document.body.appendChild(icon);

    setTimeout(()=>{ icon.remove(); },10000);
}

// Show message box when "Hey Cutie" is clicked
document.getElementById("introMessage").addEventListener("click", function(){
    document.getElementById("introMessage").style.display = "none";
    document.getElementById("messageBox").style.display = "block";
    setInterval(createLoveIcon,300);
});
</script>

</body>
</html>
